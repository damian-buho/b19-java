    uk: Дистрибуція Java з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код Java отримують під час збирання, і він зберігає власну ліцензію.
