  title: B19 / Java
  description:
    en: Community-maintained distribution of Java built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream Java is fetched at build time and retains its own licensing.
