$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: java
  summary:
    en: Community-maintained distribution of Java based on B19/Ubuntu
    es: Distribución de Java mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція Java з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / Java
  description:
    en: Community-maintained distribution of Java built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream Java is fetched at build time and retains its own licensing.
    es: Distribución de Java mantenida por la comunidad, construida sobre B19/Ubuntu. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de Java se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція Java з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код Java отримують під час збирання, і він зберігає власну ліцензію.
  version: 0.5.1
  released: "2026-10-01"
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/release.yaml
  - .makefile/container/traits/image-variant.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/dockerhub.yaml
keywords:
  - java
  - jdk
  - jvm
  - language
  - runtime
  - docker
kind: SoftwareSourceCode
links:
  - label:
      en: B19 / Java on GitHub
      es: B19 / Java en GitHub
      uk: B19 / Java на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-java
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-java/issues
  - label:
      en: B19 / Java on kiota.ch
      es: B19 / Java en kiota.ch
      uk: B19 / Java на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/b19/java
  - label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/b19-java/pkgs/container/b19%2Fjava
  - label:
      en: Packages on Docker Hub
      es: Paquetes en Docker Hub
      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/b19-java
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    build:
      args:
        B19_JAVA_DISTRO: oracle
        B19_JAVA_SERIES: "25"
    image:
      distro: "{B19_JAVA_DISTRO}"
      series: "{B19_JAVA_SERIES}"
      tag: ${distro}-${series}
      variant:
        parts:
          - distro
          - series
    ci:
      matrix:
        axes:
          B19_JAVA_DISTRO:
            - oracle
            - temurin
          B19_JAVA_SERIES:
            - 21
            - 25
            - 26
            - 27
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-java.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/java.git
technologies:
  - java
  - jvm
