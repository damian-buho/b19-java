$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: java
  summary:
    en: Community-maintained distribution of Java based on B19/Ubuntu
    es: Distribución de Java mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція Java з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / Java
  description:
    en: Oracle and Temurin JDKs in series 21, 25, 26 and 27, with ZGC enabled, slim jlink runtimes for downstream images, and optional JMX metrics.
    es: JDK de Oracle y Temurin en series 21, 25, 26 y 27, con ZGC activado, runtimes jlink ligeros para imágenes derivadas y métricas JMX opcionales.
    uk: JDK від Oracle та Temurin у серіях 21, 25, 26 і 27, з увімкненим ZGC, легкими jlink-середовищами для похідних образів і опційними JMX-метриками.
  version: 0.6.3
  released: "2026-10-17"
  visibility: public
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/image/release.yaml
  - .makefile/container/traits/image/variant.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/dockerhub.yaml
keywords:
  - java
  - jdk
  - jvm
  - openjdk
  - temurin
  - jmx
kind: SoftwareSourceCode
links:
  - label:
      en: Repository on GitHub
      es: Repositorio en GitHub
      uk: Репозиторій на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-java
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-java/issues
  - label:
      en: Repository on kiota.ch
      es: Repositorio en kiota.ch
      uk: Репозиторій на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/b19/java
  - label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/b19-java/pkgs/container/b19%2Fjava
  - label:
      en: Packages on Docker Hub
      es: Paquetes en Docker Hub
      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/b19-java
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    build:
      args:
        B19_JAVA_DISTRO: oracle
        B19_JAVA_SERIES: "25"
    image:
      distro: "{B19_JAVA_DISTRO}"
      series: "{B19_JAVA_SERIES}"
      tag: ${distro}-${series}
      variant:
        parts:
          - distro
          - series
    ci:
      matrix:
        axes:
          B19_JAVA_DISTRO:
            - oracle
            - temurin
          B19_JAVA_SERIES:
            - 21
            - 25
            - 26
            - 27
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-java.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/java.git
technologies:
  - java
  - jvm
